services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_WEBHOOK_HOSTNAME: ${PUBLIC_WEBHOOK_HOSTNAME:?Set PUBLIC_WEBHOOK_HOSTNAME in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
