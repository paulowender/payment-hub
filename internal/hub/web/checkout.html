<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Finalizar compra</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/checkout/assets/checkout.css"><script defer src="/checkout/assets/checkout.js"></script></head>
<body><main id="checkout"><section class="summary"><header class="brand"><img id="logo" alt="" hidden><span id="brand-name">Checkout</span></header><div class="order"><p id="brand-description"></p><h1 id="offer-name">Preparando sua compra…</h1><p id="offer-description"></p><p class="price" id="price"></p><p id="period"></p><div class="receipt"><span>Total de hoje</span><strong id="total">—</strong></div><p id="recurrence-note"></p></div><footer id="environment"></footer></section>
<section class="payment"><div id="status" role="status" aria-live="polite"></div><form id="payment-form" hidden>
<h2>Finalize sua compra</h2><p class="intro">Preencha seus dados para pagar com cartão de crédito.</p>
<fieldset><legend>Seus dados</legend><div class="fields"><label class="wide">Nome completo<input name="name" autocomplete="name" required minlength="3" maxlength="100"></label><label class="wide">E-mail<input name="email" type="email" autocomplete="email" required maxlength="200"></label><label>CPF ou CNPJ<input name="document" inputmode="numeric" required maxlength="18"></label><label>Celular com DDD<input name="phone" autocomplete="tel-national" inputmode="tel" required maxlength="16"></label></div></fieldset>
<fieldset><legend>Endereço de cobrança</legend><div class="fields"><label>CEP<input name="zip_code" autocomplete="postal-code" inputmode="numeric" required maxlength="9"></label><label>Número<input name="number" required maxlength="20"></label><label class="wide">Rua e bairro<input name="street" autocomplete="address-line1" required minlength="2" maxlength="150"></label><label>Cidade<input name="city" autocomplete="address-level2" required minlength="2" maxlength="100"></label><label>Estado (UF)<input name="state" autocomplete="address-level1" pattern="[A-Za-z]{2}" maxlength="2" required placeholder="SP"></label></div></fieldset>
<fieldset><legend>Forma de pagamento</legend><label>Como deseja pagar?<select id="payment-method"></select></label><label id="installments-wrap">Parcelamento<select id="installments"></select></label></fieldset>
<fieldset id="card-fields"><legend>Cartão de crédito</legend><div class="fields"><label class="wide">Nome impresso no cartão<input id="holder" autocomplete="cc-name" required maxlength="64"></label><label class="wide">Número do cartão<input id="card-number" autocomplete="cc-number" inputmode="numeric" required maxlength="23"></label><label>Validade (MM/AAAA)<input id="expiry" autocomplete="cc-exp" inputmode="numeric" placeholder="12/2030" pattern="(0[1-9]|1[0-2])/[0-9]{4}" required maxlength="7"></label><label>Código de segurança<input id="cvv" type="password" autocomplete="cc-csc" inputmode="numeric" pattern="[0-9]{3,4}" required maxlength="4"></label></div></fieldset>
<label class="consent" id="consent-wrap" hidden><input id="consent" type="checkbox"><span id="consent-text"></span></label>
<p id="error" role="alert"></p><button id="pay" type="submit">Pagar</button><p class="security">Os dados do cartão são enviados diretamente ao processador de pagamentos, por conexão segura.</p></form></section></main></body></html>
