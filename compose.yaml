services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paymenthub
      POSTGRES_USER: paymenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U paymenthub -d paymenthub]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - '127.0.0.1:${PAYMENT_HUB_PORT:-18080}:8080'
    environment:
      DATABASE_URL: postgres://paymenthub:${POSTGRES_PASSWORD}@db:5432/paymenthub?sslmode=disable
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
      WEBHOOK_DIAGNOSTIC_TENANT: ${WEBHOOK_DIAGNOSTIC_TENANT:-}
      WEBHOOK_DIAGNOSTIC_UNTIL: ${WEBHOOK_DIAGNOSTIC_UNTIL:-}
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
      PUBLIC_WEBHOOK_HOSTNAME: ${PUBLIC_WEBHOOK_HOSTNAME:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
